<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turbo Lane – Car Racing Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <div id="hud">
      <div class="hud-item">Score <span id="score">0</span></div>
      <div class="hud-item">Speed <span id="speed">0</span> km/h</div>
      <div class="hud-item">Best <span id="best">0</span></div>
      <div class="hud-item" id="lives">❤❤❤</div>
    </div>

    <canvas id="game" width="400" height="640"></canvas>

    <div id="start-screen" class="overlay">
      <h1>TURBO LANE</h1>
      <p>Dodge traffic, collect coins, and survive as long as you can!</p>
      <div class="controls">
        <p><b>← →</b> or <b>A / D</b> — steer</p>
        <p><b>↑ / W</b> — boost &nbsp; <b>↓ / S</b> — brake</p>
        <p><b>P</b> — pause</p>
        <p>On mobile: tap the buttons below</p>
      </div>
      <button id="start-btn">START GAME</button>
    </div>

    <div id="pause-screen" class="overlay hidden">
      <h1>PAUSED</h1>
      <button id="resume-btn">RESUME</button>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p>Your score: <span id="final-score">0</span></p>
      <p id="new-best" class="hidden">🏆 New best score!</p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>

    <div id="touch-controls">
      <button id="btn-left" aria-label="Left">◀</button>
      <button id="btn-boost" aria-label="Boost">▲</button>
      <button id="btn-right" aria-label="Right">▶</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
